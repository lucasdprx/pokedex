name: Update Pokémon lists
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/dex.py || true
      - run: python tools/costumes.py || true
      - run: python tools/max.py || true
      - run: python tools/mega.py || true
      - run: |
          git diff --quiet dex.json costumes.json max.json mega.json && exit 0
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add dex.json costumes.json max.json mega.json
          git commit -m "Update Pokémon lists (dex, costumes, Max, Mega)"
          git pull --rebase   # raids.yml pousse chaque heure : ne pas perdre la mise à jour du jour
          git push
