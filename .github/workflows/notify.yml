name: Morning notifications
on:
  schedule:
    - cron: "0 7 * * *"   # 8 h (heure de Paris, hiver)
  workflow_dispatch:
    inputs:
      test:
        description: "Test: send now, even what was already announced"
        type: boolean
        default: false
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install firebase-admin pywebpush
      - run: python tools/notify.py
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          TEST: ${{ inputs.test }}
