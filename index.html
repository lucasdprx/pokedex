<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pokédex Pokémon GO</title>
<meta name="theme-color" content="#9fe3ec">
<script>
// Thème avant le premier affichage (pas d'éclair clair) : Auto suit le téléphone
(function () {
  var t = localStorage.getItem("pokedex-go-theme") || "auto";
  var dark = t === "dark" || (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="splash" aria-hidden="true"><div class="sp-half sp-t"></div><div class="sp-half sp-b"></div></div>
<script>
// Écran de lancement (splash v2 : L1, Q1) : la Poké Ball tremble puis s'ouvre, ~1 s
setTimeout(function () { var s = document.getElementById("splash"); if (s) s.remove(); }, 1300);
</script>
<header>
  <div class="top">
    <span class="ball"></span>
    <h1>Pokédex GO</h1>
    <button class="globe" id="nowBtn" data-i18n-aria="nowTitle" aria-label="En ce moment"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="4.5" width="14" height="12.5" rx="1.5"/><path d="M3 8.5h14M7 2.5v4M13 2.5v4"/><text id="nowDay" x="10" y="15.4" text-anchor="middle" font-size="6.5" font-weight="700" fill="currentColor" stroke="none"></text></svg><i id="nowDot" hidden></i></button>
    <div class="menu" id="langMenu" hidden></div>
    <button class="more" id="more" data-i18n-aria="menu" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 5.5h14M3 10h14M3 14.5h14"/></svg></button>
    <div class="menu-veil" id="menuVeil" hidden></div>
    <div class="menu drawer" id="menu" hidden>
      <div id="acctMenu">
      <div class="acct-head"><span id="acct" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10" cy="7" r="3.5"/><path d="M3 18c1-4 4-5.5 7-5.5s6 1.5 7 5.5"/></svg></span><span data-i18n="account">Mon compte</span></div>
      <div class="who" id="acctWho" hidden></div>
      <label class="pseudo" id="pseudoBox" hidden><span data-i18n="pseudo">Ton pseudo</span><input id="pseudo" maxlength="24" autocomplete="nickname"></label>
      <button id="signIn" data-i18n="signIn" hidden>Se connecter</button>
      <button id="signOut" data-i18n="signOut" hidden>Se déconnecter</button>
    </div>
      <hr>
      <button id="themeBtn"><span data-i18n="theme">Thème</span><b><span class="sky" aria-hidden="true"><i>☀️</i><i>🌙</i></span><span id="themeCur"></span></b></button>
      <button id="notifBtn"><span data-i18n="notifs">Notifications</span><span class="sw" id="notifSw"></span></button>
      <hr>
      <button id="export" data-i18n="export">Exporter</button>
      <button id="import" data-i18n="import">Importer</button>
      <button id="shareBtn" data-i18n="share">Partager mon Pokédex</button>
      <button id="installBtn" data-i18n="install" hidden>Installer l'appli</button>
      <button id="langBtn"><span data-i18n="language">Langue</span><b id="langCur"></b></button>
    </div>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
    <input type="file" id="genieFile" accept="text/csv,.csv" hidden>
    <input type="file" id="shotFiles" accept="image/*" multiple hidden>
  </div>
  <div class="controls">
    <select id="coll" data-i18n-aria="cDex">
      <option value="dex" data-i18n="cDex">Pokédex</option>
      <option value="shiny" data-i18n="cShiny">Shiny</option>
      <option value="mega" data-i18n="cMega">Méga</option>
      <option value="shadow" data-i18n="cShadow">Obscurs</option>
      <option value="purified" data-i18n="cPurified">Purifiés</option>
    </select>
    <input type="search" id="search" placeholder="Rechercher" autocomplete="off"
           data-i18n-ph="search" data-i18n-aria="searchLabel">
    <select id="filter" data-i18n-aria="filter">
      <option value="all" data-i18n="fAll">Tous</option>
      <option value="caught" data-i18n="fCaught">Capturés</option>
      <option value="missing" data-i18n="fMissing">Manquants</option>
      <option value="now" data-i18n="fNow">À chercher maintenant</option>
      <option value="unavailable" data-i18n="fUnavailable">Indisponibles</option>
    </select>
  </div>
  <div class="friend-band" id="friendBand" hidden><b id="friendName"></b><button id="friendX" aria-label="Fermer">✕</button></div>
  <div class="stats">
    <div class="bar"><div id="progress"></div></div>
    <span id="count">0 / 0</span>
  </div>
  <nav class="tabs" id="gens" data-i18n-aria="regions"></nav>
</header>
<main>
  <div id="status" class="status"><div class="spinner"></div>Récupération des Pokémon de Pokémon GO…</div>
  <div id="grid" class="grid"></div>
</main>

<dialog id="sourceDialog" class="sheet">
  <h2 data-i18n="import">Importer</h2>
  <form method="dialog">
    <button value="save" data-i18n="srcSave">Sauvegarde du site</button>
    <button value="genie">Poké Genie</button>
    <button value="shots" data-i18n="srcShots">Captures du Pokédex</button>
    <button class="quiet" value="cancel" data-i18n="cancel">Annuler</button>
  </form>
</dialog>

<dialog id="reviewDialog" class="review">
  <h2 id="reviewTitle"></h2>
  <p id="reviewText"></p>
  <div class="rv-list" id="reviewList"></div>
  <form method="dialog">
    <button class="primary" value="add" id="reviewAdd"></button>
    <button class="quiet" value="cancel" id="reviewCancel">Annuler</button>
  </form>
</dialog>

<dialog id="importDialog">
  <h2 id="importTitle"></h2>
  <p id="importText"></p>
  <form method="dialog">
    <button class="primary" value="merge" data-i18n="merge">Fusionner</button>
    <button class="danger" value="replace" data-i18n="replace">Remplacer</button>
    <button class="quiet" value="cancel" data-i18n="cancel">Annuler</button>
  </form>
</dialog>

<dialog id="loginDialog">
  <h2 data-i18n="signIn">Se connecter</h2>
  <form method="dialog">
    <button class="primary google" type="button" id="googleBtn"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg><span data-i18n="google">Continuer avec Google</span></button>
  </form>
  <form id="linkForm" class="link">
    <input type="email" id="loginEmail" required autocomplete="email" data-i18n-ph="email" data-i18n-aria="email">
    <button type="submit" data-i18n="sendLink">Recevoir un lien</button>
  </form>
  <form method="dialog">
    <button class="quiet" value="cancel" data-i18n="cancel">Annuler</button>
  </form>
</dialog>

<dialog id="installDialog">
  <h2 data-i18n="install">Installer l'appli</h2>
  <ol class="steps" id="installSteps"></ol>
  <form method="dialog">
    <button class="quiet" data-i18n="close">Fermer</button>
  </form>
  <div class="install-arrow" id="installArrow" aria-hidden="true">↓</div>
</dialog>

<dialog id="ficheDialog" class="sheet fiche"></dialog>
<dialog id="nowDialog" class="now">
  <div class="now-head">
    <h2 id="nowTitle">En ce moment</h2>
    <form method="dialog"><button class="now-x" data-i18n-aria="close" aria-label="Fermer">✕</button></form>
  </div>
  <nav class="now-tabs" id="nowTabs"></nav>
  <nav class="now-tabs sub" id="nowCats"></nav>
  <div class="now-scroll">
    <div id="nowBody"></div>
    <h3 data-i18n="hMore">Plus</h3>
    <a class="now-more" href="https://leekduck.com/" target="_blank" rel="noopener">Leek Duck ↗</a>
  </div>
</dialog>

<dialog id="sentDialog">
  <h2 data-i18n="linkSent">Lien envoyé</h2>
  <p id="sentText"></p>
  <form method="dialog">
    <button class="quiet" data-i18n="close">Fermer</button>
  </form>
</dialog>

<div class="toast" id="toast" role="status" hidden></div>

<script src="i18n.js"></script>
<script src="app.js"></script>
<script src="events.js"></script>
<script type="module" src="sync.js"></script>
</body>
</html>
