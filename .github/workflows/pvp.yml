name: Update PvPoke list
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/pvp.py
      - run: python tools/costumes.py
      - run: |
          git diff --quiet pvp.json costumes.json && exit 0
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add pvp.json costumes.json
          git commit -m "Update PvPoke and costume lists"
          git push
