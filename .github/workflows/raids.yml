name: Update raid bosses
# Page Raids de Leek Duck relue chaque heure (ScrapedDuck ne la relit qu'une fois par jour)
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/raids.py
      - run: |
          git diff --quiet raids.json && exit 0
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add raids.json
          git commit -m "Update raid bosses"
          git pull --rebase
          git push
