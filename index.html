<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pokédex Pokémon GO</title>
<meta name="theme-color" content="#9fe3ec">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  /* Style « Pokémon GO » : ciel bleu clair, cartes blanches translucides */
  :root {
    --bg: #9fe3ec;
    --card: rgba(255,255,255,.45);
    --card-caught: rgba(255,255,255,.88);
    --deep: #ffffff;
    --line: #c6ebf1;
    --soft: #e3f6f9;
    --accent: #1b8fb0;
    --accent2: #1b8fb0;
    --warn: #d64545;
    --gold: #f0b429;
    --text: #1f5f7a;
    --strong: #1b7a9b;
    --muted: #5c9bb0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  /* En-tête compact */
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: linear-gradient(180deg, var(--deep), #16213e);
    padding: 14px 20px 0;
    box-shadow: 0 4px 16px rgba(0,0,0,.4);
  }
  /* Bascule Normal / Shiny */
  .mode {
    margin-left: auto; flex: none;
    display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
  }
  .mode button {
    background: none; border: 0; padding: 5px 8px; white-space: nowrap;
    color: var(--muted); font: inherit; font-size: .85rem; cursor: pointer;
  }
  .mode button.on { background: var(--line); color: var(--text); }
  .mode button.on.gold { color: #f7d84a; }
  .globe {
    flex: none; background: none; border: 0; padding: 2px 4px;
    color: var(--text); cursor: pointer; display: flex; align-items: center;
  }
  .globe svg { width: 20px; height: 20px; }
  .more { flex: none; margin-left: 0; }
  @media (max-width: 400px) {
    .top { gap: 4px; }
    h1 { font-size: 1.05rem; }
    .mode button { padding: 4px 4px; font-size: .76rem; }
    .globe { padding: 2px; }
  }
  #acct { margin-left: auto; }
  #langMenu { min-width: 160px; }
  #acctMenu { min-width: 200px; }
  #acctMenu button { display: flex; }
  #acctMenu [hidden] { display: none; }
  /* Installer sur iPhone : la fenêtre descend près de la barre de Safari, une flèche montre où toucher */
  #installDialog { margin-bottom: 84px; }
  #installDialog .steps { list-style: none; margin: 0 0 6px; padding: 0; counter-reset: st; }
  #installDialog .steps li {
    display: flex; align-items: center; gap: 10px; padding: 10px 0; font-size: .95rem;
    border-top: 1px solid var(--soft); counter-increment: st;
  }
  #installDialog .steps li:first-child { border-top: 0; }
  #installDialog .steps li::before {
    content: counter(st); width: 22px; height: 22px; border-radius: 50%; flex: none;
    display: grid; place-items: center; background: var(--soft); color: var(--strong); font-weight: 700; font-size: .8rem;
  }
  #installDialog .steps svg { width: 20px; height: 20px; color: var(--accent); flex: none; }
  .install-arrow {
    position: fixed; bottom: 6px; left: 50%; transform: translateX(-50%);
    color: #fff; font-size: 2rem; line-height: 1; text-shadow: 0 2px 6px rgba(0,0,0,.35);
    animation: install-bob 1s ease-in-out infinite;
  }
  .install-arrow.right { left: auto; right: 14px; transform: none; animation-name: install-bob-r; }
  .install-arrow[hidden] { display: none; }
  @keyframes install-bob { 50% { transform: translate(-50%, 8px); } }
  @keyframes install-bob-r { 50% { transform: translateY(8px); } }
  #acctMenu b { margin-left: auto; padding-left: 12px; font-weight: 400; color: var(--muted); }
  #acct .av {
    display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%;
    background: var(--accent); color: #fff; font-weight: 700; font-size: .78rem;
  }
  #acctMenu .who {
    padding: 8px 12px 6px; font-size: .85rem; color: var(--muted);
    max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #loginDialog form + form { margin-top: 8px; }
  #loginDialog .google { display: flex; align-items: center; justify-content: center; gap: 8px; }
  #loginDialog .google svg { width: 18px; height: 18px; background: #fff; border-radius: 50%; padding: 2px; box-sizing: content-box; }
  #loginDialog input {
    padding: 10px; border: 2px solid var(--line); border-radius: 10px; font: inherit; color: var(--text);
  }
  #loginDialog input:focus { border-color: var(--accent); outline: none; }
  .toast {
    position: fixed; left: 12px; right: 12px; bottom: 14px; z-index: 30; max-width: 480px; margin: 0 auto;
    background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
    font-size: .88rem; color: var(--text); box-shadow: 0 8px 24px rgba(31,95,122,.3);
  }
  .toast b { color: var(--warn); }
  /* Feuille « En ce moment » : onglets Maintenant / Bientôt, rangée par source */
  dialog.now {
    width: 100%; max-width: 480px; height: min(86vh, 720px); margin: auto auto 0;
    border-radius: 14px 14px 0 0; border-bottom: 0; padding: 0; flex-direction: column;
  }
  dialog.now[open] { display: flex; }
  .now-head { display: flex; align-items: center; padding: 16px 16px 6px; }
  .now-head h2 { margin: 0; flex: 1; }
  dialog .now-x { background: none; border: 0; color: var(--muted); font-size: 1.2rem; padding: 4px 8px; }
  .now-tabs { display: flex; gap: 18px; padding: 0 16px; border-bottom: 1px solid var(--soft); }
  dialog .now-tabs button {
    background: none; border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 8px 0 9px;
    font: inherit; font-weight: 700; font-size: .82rem; text-transform: uppercase; color: var(--muted);
  }
  dialog .now-tabs button.on { color: var(--strong); border-bottom-color: var(--accent); }
  body.shiny dialog .now-tabs button.on { border-bottom-color: var(--gold); }
  .now-scroll { flex: 1; overflow-y: auto; padding: 0 16px 24px; min-height: 0; }
  .now-scroll h3 { margin: 16px 0 6px; font-size: .8rem; text-transform: uppercase; color: var(--muted); }
  .now-row { display: flex; align-items: center; gap: 10px; padding: 4px 0; font-size: .95rem; }
  .now-row img { width: 40px; height: 40px; object-fit: contain; }
  .now-row b { margin-left: auto; padding-left: 8px; font-size: .78rem; color: var(--accent); white-space: nowrap; }
  .now-row b.later { color: #b7791f; }
  .now-empty { margin: 18px 0; color: var(--muted); }
  .now-more { color: var(--accent); text-decoration: none; }
  .types .how { color: var(--accent); }
  .types .how.off { color: var(--muted); font-weight: 500; }
  #shinyCheck { display: inline-block; width: 1.2em; color: var(--gold); }
  #langMenu button.on { color: var(--accent2); }
  body.shiny .bar > div { background: linear-gradient(90deg, #f7d84a, #f59a52); }
  body.shiny #count { color: #f7d84a; }
  body.shiny .card.caught { background: #3a3416; border-color: #f7d84a; }
  body.shiny .tab.done span { color: #f7d84a; }

  .top {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 10px;
    position: relative;
  }
  h1 { margin: 0; font-size: 1.15rem; }
  .ball {
    width: 20px; height: 20px; border-radius: 50%;
    background: linear-gradient(#e94560 50%, #fff 50%);
    border: 2px solid #222;
    position: relative;
    flex: none;
  }
  .ball::after {
    content: ""; position: absolute; inset: 0; margin: auto;
    width: 6px; height: 6px; border-radius: 50%;
    background: #fff; border: 2px solid #222;
  }
  .more {
    margin-left: 0;
    background: none; border: 0;
    color: var(--text);
    font-size: 1.3rem; line-height: 1;
    padding: 2px 6px;
    cursor: pointer;
  }
  .menu {
    position: absolute; right: 0; top: 32px;
    background: var(--deep);
    border: 1px solid var(--line);
    border-radius: 8px;
    min-width: 170px;
    padding: 4px 0;
    z-index: 20;
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
  }
  .menu[hidden] { display: none; }
  .menu button, .menu a {
    display: block; width: 100%;
    padding: 10px 14px;
    background: none; border: 0;
    color: var(--text); text-align: left; text-decoration: none;
    font: inherit; font-size: .92rem;
    cursor: pointer;
  }
  .menu button:hover, .menu a:hover { background: #1c2747; }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }

  .controls { display: flex; gap: 8px; margin-bottom: 10px; }
  input[type="search"], select {
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--deep);
    color: var(--text);
    font-size: .95rem;
  }
  input[type="search"] { flex: 1; min-width: 0; }
  select { cursor: pointer; }
  select:hover { border-color: var(--accent); }

  .stats {
    display: flex; align-items: center; gap: 10px;
    font-size: .85rem; color: var(--muted);
    margin-bottom: 8px;
  }
  .bar { flex: 1; height: 5px; background: var(--deep); border-radius: 3px; overflow: hidden; }
  .bar > div {
    height: 100%; width: 0;
    background: linear-gradient(90deg, var(--accent2), #4e9cca);
    transition: width .3s;
  }

  /* Onglets des régions : une seule ligne qui défile */
  .tabs {
    display: flex; gap: 20px;
    overflow-x: auto; scrollbar-width: none;
    margin: 0 -20px; padding: 0 20px;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: none;
    padding: 6px 0 9px;
    background: none; border: 0;
    border-bottom: 2px solid transparent;
    color: var(--muted);
    font: inherit; font-size: .88rem;
    white-space: nowrap;
    cursor: pointer;
  }
  .tab span { margin-left: 5px; font-size: .8rem; opacity: .8; }
  .tab.done span { color: var(--accent2); opacity: 1; }
  .tab:hover { color: var(--text); }
  .tab.active { color: #fff; border-bottom-color: var(--accent); }

  /* Grille */
  main { padding: 16px 20px 60px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
  }
  .card {
    background: var(--card);
    border: 2px solid transparent;
    border-radius: 10px;
    padding: 10px 6px 11px;
    text-align: center;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    position: relative;
    transition: border-color .2s, background .2s;
  }
  .card:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .card img {
    width: 104px; height: 104px;
    object-fit: contain;
    filter: grayscale(1) opacity(.4);
    transition: filter .2s;
    pointer-events: none;
  }
  .card.caught { background: var(--card-caught); border-color: var(--accent2); }
  .card.caught img { filter: none; }
  .card.locked { cursor: default; opacity: .5; background: #12121f; }
  .card.locked img { filter: grayscale(1) brightness(.5); }
  .card .dex { font-size: .72rem; color: var(--muted); }
  .card .name {
    font-size: .9rem; font-weight: 600; line-height: 1.2;
    margin-top: 1px;
    word-break: break-word;
  }
  .types { font-size: .74rem; font-weight: 600; margin-top: 3px; }
  .types span + span { margin-left: 6px; }
  .types .na { color: var(--accent); }

  /* Cri : bouton au survol (souris, clavier) ; rien sur écran tactile */
  .card .cry {
    position: absolute; top: 6px; left: 6px;
    width: 26px; height: 26px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--deep);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--text);
    cursor: pointer;
    opacity: 0;
    transition: opacity .15s, border-color .15s;
  }
  .card .cry svg { width: 14px; height: 14px; }
  .card:focus-within .cry { opacity: 1; }
  .card .cry:hover { border-color: var(--accent2); }
  @media (hover: hover) {
    .card:hover .cry { opacity: 1; }
  }
  @media (hover: none) {
    .card .cry { display: none; }
  }

  @media (max-width: 600px) {
    header { padding: 12px 14px 0; }
    .tabs { margin: 0 -14px; padding: 0 14px; gap: 18px; }
    main { padding: 12px 12px 48px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
    .card { padding: 8px 4px 9px; }
    .card img { width: 76px; height: 76px; }
    .card .name { font-size: .84rem; }
    .types { font-size: .72rem; }
  }

  .status {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
  }
  .spinner {
    width: 40px; height: 40px;
    margin: 0 auto 16px;
    border: 4px solid var(--line);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .retry { margin-top: 14px; }
  .retry button {
    padding: 9px 14px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--deep); color: var(--text);
    font-size: .95rem; cursor: pointer;
  }

  /* Fenêtre d'import */
  dialog {
    width: min(360px, calc(100% - 48px));
    background: var(--deep);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px;
  }
  dialog::backdrop { background: rgba(5,5,12,.7); }
  dialog h2 { margin: 0 0 8px; font-size: 1.05rem; }
  dialog p { margin: 0 0 16px; font-size: .9rem; color: var(--muted); }
  dialog form { display: flex; flex-direction: column; gap: 8px; margin: 0; }
  dialog button {
    padding: 11px; border-radius: 8px;
    border: 1px solid var(--line); background: #16213e; color: var(--text);
    font-size: .95rem; cursor: pointer;
  }
  dialog .primary { background: var(--accent2); border-color: var(--accent2); color: var(--deep); font-weight: 600; }
  dialog .danger { color: var(--accent); border-color: #5a2738; }
  dialog .quiet { background: none; border-color: transparent; color: var(--muted); }

  /* Import : choix de la source en bas de l'écran, puis liste des nouveaux */
  dialog.sheet {
    width: 100%; max-width: 480px;
    margin: auto auto 0; border-radius: 14px 14px 0 0; border-bottom: 0;
  }
  dialog.review {
    width: min(440px, 100%); max-height: min(640px, 92vh);
    flex-direction: column; padding: 0;
  }
  dialog.review[open] { display: flex; }
  dialog.review h2 { padding: 18px 18px 4px; margin: 0; }
  dialog.review p { padding: 0 18px; margin: 0 0 8px; }
  /* Hauteur du contenu, rognée par la fenêtre : avec flex: 1, Safari la mettait à zéro */
  .rv-list { flex: 1 1 auto; overflow-y: auto; padding: 0 12px; min-height: 0; }
  .rv-row {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 4px; border-bottom: 1px solid #1c2747; cursor: pointer;
    user-select: none; -webkit-user-select: none;
  }
  .rv-row img { width: 44px; height: 44px; object-fit: contain; }
  .rv-row .rv-name { flex: 1; font-size: .92rem; font-weight: 600; }
  .rv-row .rv-dex { font-size: .72rem; color: var(--muted); }
  .rv-box {
    width: 22px; height: 22px; flex: none; border-radius: 5px;
    border: 2px solid var(--accent2); background: var(--accent2); color: var(--deep);
    font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center;
  }
  .rv-row.off .rv-box { background: none; color: transparent; border-color: var(--line); }
  .rv-row.off img { filter: grayscale(1) opacity(.4); }
  .rv-row.doubt .rv-name::after { content: " ?"; color: var(--accent); }
  dialog.review form { padding: 12px 18px 18px; }
  /* ---------- Style « Pokémon GO » (maquettes/design/v1, D1) ---------- */
  body {
    font-family: "Rubik", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, #9fe3ec, #5cc6db) fixed;
    min-height: 100vh;
  }
  header {
    top: 10px;
    margin: 10px 10px 0;
    padding: 12px 12px 0;
    border-radius: 14px;
    background: rgba(255,255,255,.78);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    box-shadow: 0 4px 14px rgba(31,95,122,.15);
  }
  h1 { font-weight: 800; color: var(--strong); text-transform: uppercase; letter-spacing: .02em; font-size: 1.05rem; }
  .mode { border: 0; background: var(--soft); border-radius: 10px; }
  .mode button { color: var(--muted); font-weight: 500; }
  .mode button.on { background: var(--accent); color: #fff; }
  .mode button.on.gold { background: var(--gold); color: #fff; }
  .globe, .more { color: var(--strong); }
  input[type="search"], select {
    background: #fff; border: 2px solid var(--line); border-radius: 10px; color: var(--text); font-family: inherit;
  }
  input[type="search"]::placeholder { color: #8fc0cf; }
  select { font-weight: 700; }
  select:hover, input[type="search"]:focus { border-color: var(--accent); outline: none; }
  .stats { color: var(--strong); font-weight: 800; }
  .bar { height: 8px; background: #d4f0f5; border-radius: 4px; }
  .bar > div { background: var(--accent); border-radius: 4px; }
  .tabs { margin: 0 -12px; padding: 0 12px; }
  .tab { color: var(--muted); font-weight: 700; text-transform: uppercase; font-size: .78rem; }
  .tab span { opacity: 1; }
  .tab:hover { color: var(--strong); }
  .tab.active { color: var(--strong); border-bottom-color: var(--accent); }
  .tab.done span { color: var(--accent); }
  main { padding: 12px 10px 48px; }
  .card { background: var(--card); border: 2px solid rgba(255,255,255,.7); border-radius: 12px; }
  .card:focus-visible { outline: 2px solid var(--accent); }
  .card img { filter: brightness(0) opacity(.12); }
  .card.caught { background: var(--card-caught); border-color: rgba(255,255,255,.95); }
  .card.locked { background: rgba(255,255,255,.2); opacity: .6; }
  .card.locked img { filter: brightness(0) opacity(.08); }
  .card .dex { color: #4b8fa5; font-weight: 500; font-size: .95rem; }
  .card .name { font-weight: 700; color: var(--text); }
  .types { font-weight: 700; }
  .types .na { color: var(--warn); }
  .card .cry { background: #fff; border-color: var(--line); color: var(--strong); }
  .card .cry:hover { border-color: var(--accent); }
  body.shiny .bar > div { background: var(--gold); }
  body.shiny #count { color: #b7791f; }
  body.shiny .card.caught { background: rgba(255,248,214,.94); border-color: var(--gold); }
  body.shiny .tab.done span { color: #b7791f; }
  .menu { background: #fff; border-color: var(--line); box-shadow: 0 8px 24px rgba(31,95,122,.25); }
  .menu button, .menu a { color: var(--text); }
  .menu button:hover, .menu a:hover { background: var(--soft); }
  .status { color: var(--strong); }
  .spinner { border-color: #d4f0f5; border-top-color: var(--accent); }
  .retry button { background: #fff; border-color: var(--line); color: var(--text); }
  dialog { background: #fff; color: var(--text); border-color: var(--line); box-shadow: 0 12px 40px rgba(31,95,122,.3); }
  dialog::backdrop { background: rgba(20,60,80,.45); }
  dialog h2 { color: var(--strong); }
  dialog button { background: var(--soft); border-color: var(--line); color: var(--text); font-family: inherit; }
  dialog .primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  dialog .danger { color: var(--warn); border-color: #f3c4c4; background: #fff; }
  dialog .quiet { background: none; border-color: transparent; color: var(--muted); }
  dialog button:focus-visible, .menu button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  dialog button:focus:not(:focus-visible) { outline: none; }
  .rv-row { border-bottom-color: var(--soft); }
  .rv-box { color: #fff; }
  .rv-row.doubt .rv-name::after { color: var(--warn); }
  @media (max-width: 600px) {
    .card .dex { font-size: .88rem; }
  }
</style>
</head>
<body>
<header>
  <div class="top">
    <span class="ball"></span>
    <h1>Pokédex</h1>
    <button class="globe" id="acct" data-i18n-aria="account" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10" cy="7" r="3.5"/><path d="M3 18c1-4 4-5.5 7-5.5s6 1.5 7 5.5"/></svg></button>
    <div class="menu" id="acctMenu" hidden>
      <div class="who" id="acctWho" hidden></div>
      <button id="signIn" data-i18n="signIn" hidden>Se connecter</button>
      <button id="signOut" data-i18n="signOut" hidden>Se déconnecter</button>
      <hr>
      <button id="installBtn" data-i18n="install" hidden>Installer l'appli</button>
      <button id="langBtn"><span data-i18n="language">Langue</span><b id="langCur"></b></button>
    </div>
    <div class="menu" id="langMenu" hidden></div>
    <button class="more" id="more" data-i18n-aria="menu" aria-haspopup="true" aria-expanded="false">⋯</button>
    <div class="menu" id="menu" hidden>

function readCache() {
  try {
    const c = JSON.parse(localStorage.getItem(CACHE_KEY));
    const ok = c && typeof c.time === "number" && Array.isArray(c.released) && Array.isArray(c.shiny) &&
               Array.isArray(c.data) && c.data.length > 0 &&
               c.data.every(e => e && typeof e.pokemon_id === "number" && Array.isArray(e.type));
    return ok ? c : null;
  } catch { return null; }
}
function writeCache(src) {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({ time: Date.now(), ...src })); }
  catch { /* mémoire pleine : on s'en passe */ }
}

let lastSrc = null; // données brutes, pour reconstruire les cartes au changement de langue
async function init() {
  await loadNames();
  const cached = readCache();
  if (cached) {
    try { buildEntries(cached); }
    catch { localStorage.removeItem(CACHE_KEY); return init(); } // copie abîmée : on retélécharge
    els.status.style.display = "none";
    render();
    if (Date.now() - cached.time < CACHE_MAX_AGE) return;
    // Données de plus d'un jour : mise à jour en fond, sans bloquer l'affichage
    try {
      const fresh = await fetchSources();
      writeCache(fresh);
      const changed = JSON.stringify(fresh.data) !== JSON.stringify(cached.data) ||
                      JSON.stringify(fresh.released) !== JSON.stringify(cached.released) ||
                      JSON.stringify(fresh.shiny) !== JSON.stringify(cached.shiny);
      if (changed) { buildEntries(fresh); render(); }
    } catch { /* hors ligne : on garde la copie */ }
    return;
  }

  els.status.style.display = "";
  els.status.innerHTML = `<div class="spinner"></div>${t("loading")}`;
  try {
    const fresh = await fetchSources();
    writeCache(fresh);
    buildEntries(fresh);
    els.status.style.display = "none";
    render();
  } catch (err) {
    els.status.innerHTML =
      `${t("loadFail")}<br><small>${err.message}</small>` +
      `<div class="retry"><button onclick="init()">${t("retry")}</button></div>`;
  }
}

// Télécharge les listes (pogoapi + PvPoke) → { data, released } bruts, avant tri en cartes
async function fetchSources() {
  const [resTypes, resRel, resPvp, resShiny] = await Promise.all([
    fetch(TYPES_URL), fetch(RELEASED_URL), fetch(PVP_URL).catch(() => null),
    fetch(SHINY_URL).catch(() => null),
  ]);
  if (!resTypes.ok) throw new Error("HTTP " + resTypes.status);
  if (!resRel.ok) throw new Error("HTTP " + resRel.status);
  const data = await resTypes.json();
  // Disponibles dans GO (n° de Pokédex) = union pogoapi + PvPoke (plus à jour)
  const released = new Set(Object.keys(await resRel.json()).map(Number));
  if (resPvp && resPvp.ok) {
    try {
      const pvp = await resPvp.json();
      (pvp.pokemon || []).forEach(p => { if (p.released) released.add(p.dex); });
      // Comble les espèces manquantes de pogoapi (ex : 902 Paragruel) via PvPoke
      const typesDex = new Set(data.map(e => e.pokemon_id));
      const seen = new Set();
      (pvp.pokemon || []).forEach(p => {
        if (p.dex > 0 && p.dex <= 1025 && !typesDex.has(p.dex) && !seen.has(p.dex)) {
          seen.add(p.dex);
          data.push({
            pokemon_id: p.dex,
            pokemon_name: (p.speciesName || "").replace(/\s*\(.*\)$/, ""),
            form: "Normal",
            type: (p.types || []).filter(t => t && t !== "none")
                   .map(t => t.charAt(0).toUpperCase() + t.slice(1)),
          });
        }
      });
    } catch { /* PvPoke indispo : on garde pogoapi seul */ }
  }
  // Shiny sortis dans GO (n° de Pokédex) ; liste vide si pogoapi ne répond pas
  let shiny = [];
  if (resShiny && resShiny.ok) {
    try { shiny = Object.keys(await resShiny.json()).map(Number).sort((a, b) => a - b); } catch {}
  }
  return { data, released: [...released].sort((a, b) => a - b), shiny };
}

// Données brutes → cartes (une par forme de base ou régionale)
function buildEntries(src) {
  lastSrc = src;
  const { data, released: releasedList, shiny: shinyList = [] } = src;
  const released = new Set(releasedList);
  const shinyOut = new Set(shinyList);
  // Espèces dont la forme de base est présente dans les données.
  // Certaines espèces (Palarticho, M. Glaquette…) n'existent QUE sous un nom "régional"
  // (Galarian) sans forme de base : c'est alors leur forme normale, à compter.
  const hasBaseForm = new Set();
  data.forEach(e => {
    if ((e.form || "Normal").toUpperCase() === (DEFAULT_FORM[e.pokemon_id] || "NORMAL"))
      hasBaseForm.add(e.pokemon_id);
  });
  const isRegionalForm = e => {
    const f = (e.form || "Normal").toUpperCase();
    return /^(ALOLA|GALAR|HISUI|PALDEA)/.test(f) && hasBaseForm.has(e.pokemon_id);
  };
  // data = [{form, pokemon_id, pokemon_name, type:[...]}, ...] → une carte par forme
  entries = data.filter(e => {
    const f = (e.form || "Normal").toUpperCase();
    const base = DEFAULT_FORM[e.pokemon_id] || "NORMAL"; // forme de base de l'espèce
    return f === base || isRegionalForm(e) ||
           (!hasBaseForm.has(e.pokemon_id) && /^(ALOLA|GALAR|HISUI|PALDEA)/.test(f));
  }).map(e => {
    const form = e.form || "Normal";
    const isBase = !isRegionalForm(e); // base = forme normale OU seule forme (régionale sans base)
    const formLabel = isBase ? "" : (FORM_FR[form.toUpperCase()] || prettyForm(form));
    const tpl = isBase ? "{n}" : ((FORM_NAMES[LANG] || FORM_NAMES.en)[form.toUpperCase()] || "{n} (" + prettyForm(form) + ")");
    const name = tpl.replace("{n}", nameOf(e.pokemon_id, e.pokemon_name));
    const region = regionOf(e.pokemon_id);
    const types = e.type || [];
    // Texte de recherche : noms dans toutes les langues + forme + région + types + n° (avec/sans zéros)
    const search = normalize([
      name, ...LANGS.map(([l]) => nameOf(e.pokemon_id, e.pokemon_name, l)),
      isBase ? "" : prettyForm(form), region, regionName(region),
      ...types.map(ty => typeName(ty) + " " + (TYPE_FR[ty] || ty)),
      e.pokemon_id, String(e.pokemon_id).padStart(4, "0"),
      released.has(e.pokemon_id) ? "" : "indisponible",
    ].join(" "));
    return {
      key: e.pokemon_id + "_" + form,
      id: e.pokemon_id,
      name, region, form, formLabel, types, search,
      regional: !isBase,           // formes régionales : non comptées dans le Pokédex
      available: released.has(e.pokemon_id), // disponible dans Pokémon GO ?
      shinyOut: shinyOut.has(e.pokemon_id),   // son shiny est sorti ?
    };
  }).sort((a, b) => a.id - b.id || a.regional - b.regional || a.form.localeCompare(b.form));
  byKey = new Map(entries.map(e => [e.key, e]));
  if (typeof buildHow === "function") buildHow();
}

// Entrées correspondant aux filtres actifs (région, recherche, capturé/manquant)
function filtered() {
  // Recherche multi-mots : chaque mot doit correspondre (nom, forme, région, type, n°)
  const terms = normalize(els.search.value).split(/\s+/).filter(Boolean);
  const mode = els.filter.value;
  return entries.filter(e => {
    if (mode === "caught" && !marks().has(e.key)) return false;
    if (mode === "missing" && (marks().has(e.key) || !can(e))) return false;
    if (mode === "unavailable" && can(e)) return false;
    if (regionFilter && e.region !== regionFilter) return false;
    if (terms.length && !terms.every(t => e.search.includes(t))) return false;
    return true;
  });
}

const spriteOf = e => REGIONAL_SPRITES[e.id + "_" + e.form.toUpperCase()] || e.id;

function typesHtml(e) {
  if (!e.available) return `<span class="na">${t("unavailable")}</span>`;
  if (shinyMode && !e.shinyOut) return `<span class="na">${t("notOut")}</span>`;
  // Manquant : comment l'avoir (events.js), une fois la liste Leek Duck reçue
  const how = window.howToGet && howToGet(e);
  if (how) return how;
  return e.types.map(ty =>
    `<span style="color:${TYPE_COLOR[ty] || "#aaa"}">${typeName(ty)}</span>`
  ).join("");
}

// Image introuvable : wsrv.nl → illustration d'origine → petit sprite → rien
function imgFallback(img) {
  const id = img.dataset.sprite;
  const sh = img.dataset.shiny === "1";
  const step = Number(img.dataset.step || 0);
  img.dataset.step = step + 1;
  if (step === 0) img.src = sh ? SPRITE_SHINY(id) : SPRITE(id);
  else if (step === 1) img.src = sh ? SPRITE_2D_SHINY(id) : SPRITE_2D(id);
  else if (step === 2 && sh) img.src = SPRITE_SMALL(id); // pas d'image shiny : l'image normale
  else img.style.visibility = "hidden";
}

function render() {
  const list = filtered();
  const frag = document.createDocumentFragment();

  for (const e of list) {
    const spriteId = spriteOf(e);
    const card = document.createElement("div");
    card.className = "card" + (marks().has(e.key) ? " caught" : "") + (can(e) ? "" : " locked");
    card.dataset.key = e.key;
    card.tabIndex = 0;
    card.innerHTML =
      `<button class="cry" aria-label="${t("cry")}">${SPEAKER}</button>` +
      `<img loading="lazy" decoding="async" crossorigin="anonymous" src="${shinyMode ? SPRITE_SMALL_SHINY(spriteId) : SPRITE_SMALL(spriteId)}" alt="" draggable="false" ` +
        `data-sprite="${spriteId}" data-shiny="${shinyMode ? 1 : 0}" onerror="imgFallback(this)">` +
      `<div class="dex">${String(e.id).padStart(4, "0")}</div>` +
      `<div class="name">${e.name}</div>` +
      `<div class="types">${typesHtml(e)}</div>`;
    frag.appendChild(card);
  }
  els.grid.replaceChildren(frag);
  if (!list.length) els.grid.innerHTML = `<div class="status" style="grid-column:1/-1">${t("noResult")}</div>`;
  updateStats();
}

function toggle(key, card) {
  const set = marks();
  if (set.has(key)) set.delete(key);
  else set.add(key);
  saveCaught();
  // La fiche reste en place, même si elle ne correspond plus au filtre :
  // la liste ne se refait qu'au changement de filtre, de région ou de recherche
  card.classList.toggle("caught");
  card.querySelector(".types").innerHTML = typesHtml(byKey.get(key));
  updateStats();
}

function updateStats() {
  // On ne compte que les formes de base disponibles (régionales et indisponibles exclues)
  const base = entries.filter(e => !e.regional && can(e));
  const total = base.length;
  const got = base.filter(e => marks().has(e.key)).length;
  const pct = total ? Math.round((got / total) * 100) : 0;
  els.count.textContent = `${got} / ${total}`;
  els.progress.style.width = pct + "%";
  renderGens();
}

function renderGens() {
  const tot = {}, cau = {};
  let totAll = 0, cauAll = 0;
  for (const e of entries) {
    if (e.regional || !can(e)) continue;   // régionales et indisponibles non comptées
    tot[e.region] = (tot[e.region] || 0) + 1;
    totAll++;
    if (marks().has(e.key)) { cau[e.region] = (cau[e.region] || 0) + 1; cauAll++; }
  }
  // Les onglets sont reconstruits à chaque capture : garder la position de défilement
  const scroll = els.gens.scrollLeft;
  els.gens.innerHTML = "";
  const addTab = (label, c, t, region) => {
    const tab = document.createElement("button");
    tab.className = "tab" + (regionFilter === region ? " active" : "") + (c === t ? " done" : "");
    tab.innerHTML = `${regionName(label)}<span>${c}/${t}</span>`;
    tab.addEventListener("click", () => {
      regionFilter = region;
      render();
      window.scrollTo(0, 0);
    });
    els.gens.appendChild(tab);
  };
  addTab(t("all"), cauAll, totAll, "");
  for (const r of REGION_ORDER.filter(r => tot[r])) addTab(r, cau[r] || 0, tot[r], r);
  els.gens.scrollLeft = scroll;
}

// --- Import Poké Genie (CSV, export en français ou en anglais) ---
function parseCsv(text) {
  const rows = [];
  let row = [], cell = "", quoted = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) {
      if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (c === '"') quoted = false;
      else cell += c;
    } else if (c === '"') quoted = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cell); cell = "";
      if (row.some(x => x !== "")) rows.push(row);
      row = [];
    } else cell += c;
  }
  row.push(cell);
  if (row.some(x => x !== "")) rows.push(row);
  return rows;
}

// Une ligne Poké Genie (n°, forme) → la carte du site qui lui correspond
const REGION_PREFIX = { alola: "ALOLA", galar: "GALAR", hisui: "HISUI", paldea: "PALDEA" };
function genieKey(id, forme) {
  const same = entries.filter(e => e.id === id);
  if (!same.length) return null;
  const reg = Object.keys(REGION_PREFIX).find(r => normalize(forme).startsWith(r));
  if (reg) {
    const e = same.find(e => e.regional && e.form.toUpperCase().startsWith(REGION_PREFIX[reg]));
    if (e) return e.key;
  }
  // Forme normale, ou forme sans carte à part (Mâle, Marche, Totémique…) : la carte de base
  const base = same.find(e => !e.regional);
  return base ? base.key : null;
}

function readGenie(text) {
  const rows = parseCsv(text.replace(/^﻿/, ""));
  const head = (rows.shift() || []).map(h => normalize(h).trim());
  const num = head.findIndex(h => h === "nombre pokemon" || h === "pokemon number");
  const form = head.findIndex(h => h === "forme" || h === "form");
  if (num < 0) throw new Error(t("notGenie"));
  const keys = new Set();
  for (const r of rows) {
    const k = genieKey(Number(r[num]), form >= 0 ? r[form] || "" : "");
    if (k) keys.add(k);
  }
  return { count: rows.length, keys: [...keys] };
}

// --- Import de captures du Pokédex du jeu ---
// Chaque case montre son numéro (« 0722 ») : en couleur au-dessus = attrapé,
// silhouette bleue = vu seulement, rien = jamais vu. Tout est lu ici, dans le navigateur.
let ocrWorker = null;
async function getOcr() {
  if (ocrWorker) return ocrWorker;
  if (!window.Tesseract) await new Promise((ok, ko) => {
    const sc = document.createElement("script");
    sc.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
    sc.onload = ok; sc.onerror = () => ko(new Error(t("noOcr")));
    document.head.appendChild(sc);
  });
  ocrWorker = await Tesseract.createWorker("eng");
  await ocrWorker.setParameters({ tessedit_char_whitelist: "0123456789" });
  return ocrWorker;
}

function loadImage(file) {
  return new Promise((ok, ko) => {
    const img = new Image();
    img.onload = () => ok(img);
    img.onerror = () => ko(new Error(t("badImage")));
    img.src = URL.createObjectURL(file);
  });
}

// Part des pixels « en couleur » dans un rectangle : ni le fond de la case, ni la silhouette bleue
function colorShare(px, W, x0, y0, x1, y1, bg) {
  let n = 0, hit = 0;
  for (let y = Math.max(0, y0 | 0); y < Math.min(px.length / 4 / W, y1); y += 2) {
    for (let x = Math.max(0, x0 | 0); x < Math.min(W, x1); x += 2) {
      const i = (y * W + x) * 4, r = px[i], g = px[i + 1], b = px[i + 2];
      n++;
      const d = Math.abs(r - bg[0]) + Math.abs(g - bg[1]) + Math.abs(b - bg[2]);
      if (d < 70) continue;                          // fond de la case
      if (b > r + 35 && g > r + 15 && b >= g - 10) continue; // bleu-cyan : silhouette ou reflet
      hit++;
    }
  }
  return n ? hit / n : 0;
}

async function readShot(file) {
  const img = await loadImage(file);
  const W = img.naturalWidth, H = img.naturalHeight;
  const cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(img, 0, 0);
  const px = ctx.getImageData(0, 0, W, H).data;
  // Lecture des numéros sur une copie en noir et blanc (le bleu clair du jeu se lit mal)
  const bw = document.createElement("canvas");
  bw.width = W; bw.height = H;
  const bctx = bw.getContext("2d");
  const bd = bctx.createImageData(W, H);
  for (let i = 0; i < px.length; i += 4) {
    const v = 0.3 * px[i] + 0.59 * px[i + 1] + 0.11 * px[i + 2] < 150 ? 0 : 255;
    bd.data[i] = bd.data[i + 1] = bd.data[i + 2] = v; bd.data[i + 3] = 255;
  }
  bctx.putImageData(bd, 0, 0);
  const { data } = await (await getOcr()).recognize(bw);
  const nums = (data.words || [])
    .map(w => ({ t: w.text.trim(), b: w.bbox, conf: w.confidence }))
    .filter(w => /^0\d{3}$/.test(w.t));
  // Largeur d'une case : 4 colonnes
  const cellW = W / 4.3;
  const out = [];
  for (const w of nums) {
    const id = Number(w.t);
    const cx = (w.b.x0 + w.b.x1) / 2, top = w.b.y0;
    // Les boutons du jeu cachent le bas de l'écran : on ignore ce qui est dessous
    if (top > H * 0.8) continue;
    const zoneTop = top - cellW * 0.95;
    // Couleur du fond de la case : juste à gauche du numéro
    const s = ((Math.max(0, w.b.y0 + 4) * W) + Math.max(0, (cx - cellW * 0.42) | 0)) * 4;
    const bg = [px[s], px[s + 1], px[s + 2]];
    const share = colorShare(px, W, cx - cellW * 0.4, zoneTop, cx + cellW * 0.4, top - 4, bg);
    // Image coupée par le haut de l'écran, ou numéro mal lu : à vérifier
    const doubt = zoneTop < H * 0.2 || w.conf < 70;
    out.push({ id, caught: share > 0.005, doubt });
  }
  URL.revokeObjectURL(img.src);
  return out;
}

  document.getElementById("reviewTitle").textContent = t("reading");
  document.getElementById("reviewList").innerHTML = "";
  document.getElementById("reviewAdd").hidden = true;
  document.getElementById("reviewCancel").hidden = true;
  const step = document.getElementById("reviewText");
  reviewDialog.showModal();
  const seen = new Map(); // id → {caught, doubt}
  let read = 0;
  try {
    for (const [i, f] of files.entries()) {
      step.textContent = t("shotStep", { i: i + 1, n: files.length });
      for (const r of await readShot(f)) {
        read++;
        const prev = seen.get(r.id);
        // Vu net sur une capture, douteux sur une autre : le net l'emporte
        if (!prev || (prev.doubt && !r.doubt) || (!prev.caught && r.caught && !r.doubt))
          seen.set(r.id, r);
      }
    }
  } catch (err) {
    reviewDialog.close();
    alert(t("importFail") + err.message);
    return;
  }
  // Attendre la vraie fermeture : sinon cet événement « close » serait pris pour la réponse de la liste
  await new Promise(ok => { reviewDialog.addEventListener("close", ok, { once: true }); reviewDialog.close(); });
  const doubt = new Set();
  const fresh = [];
  for (const [id, r] of seen) {
    if (!r.caught) continue;
    const e = entries.find(e => e.id === id && !e.regional);
    if (!e || !e.available || caught.has(e.key)) continue;
    fresh.push(e);
    if (r.doubt) doubt.add(e.key);
  }
  fresh.sort((a, b) => a.id - b.id);
  const n = files.length;
  const add = await askReview(tn("shots", n), read, fresh, doubt);
  if (!add.length) return;
  add.forEach(k => caught.add(k));
  saveCaught();
  render();
});

document.getElementById("genieFile").addEventListener("change", ev => {
  const input = ev.target;
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    input.value = "";
    let res;
    try { res = readGenie(reader.result); }
    catch (err) { alert(t("importFail") + err.message); return; }
    // Import qui ne fait qu'ajouter : seulement les cartes pas encore cochées
    const fresh = res.keys.map(k => byKey.get(k)).filter(e => e && e.available && !caught.has(e.key))
      .sort((a, b) => a.id - b.id || a.regional - b.regional);
    const add = await askReview("Poké Genie", res.count, fresh);
    if (!add.length) return;
    add.forEach(k => caught.add(k));
    saveCaught();
    render();
  };
  reader.readAsText(file);
});

// Fenêtre Fusionner / Remplacer / Annuler. Échap ou Annuler : rien ne change.
const importDialog = document.getElementById("importDialog");
function askImport(n) {
  const here = caught.size;
  document.getElementById("importTitle").textContent = t("importN", { n });
  document.getElementById("importText").textContent =
    tn("here", here);
  importDialog.returnValue = "";
  importDialog.showModal();
  return new Promise(resolve => {
    importDialog.addEventListener("close", () => resolve(importDialog.returnValue || "cancel"), { once: true });
  });
}

document.getElementById("importFile").addEventListener("change", (ev) => {
  const input = ev.target;
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    input.value = ""; // permet de réimporter le même fichier
    let clean, cleanShiny = [];
    try {
      const data = JSON.parse(reader.result);
      const list = Array.isArray(data) ? data : data.caught;
      if (!Array.isArray(list)) throw new Error(t("badFormat"));
      clean = list.filter(k => typeof k === "string");
      cleanShiny = (Array.isArray(data.shiny) ? data.shiny : []).filter(k => typeof k === "string");
    } catch (err) {
      alert(t("importFail") + err.message);
      return;
    }
    // Rien de marqué ici : rien à perdre, on charge directement
    const choice = caught.size ? await askImport(clean.length) : "replace";
    if (choice === "cancel") return;
    caught = choice === "merge" ? new Set([...caught, ...clean]) : new Set(clean);
    shinyCaught = choice === "merge" ? new Set([...shinyCaught, ...cleanShiny]) : new Set(cleanShiny);
    saveCaught();
    render();
  };
  reader.readAsText(file);
});

init();

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js");
}
